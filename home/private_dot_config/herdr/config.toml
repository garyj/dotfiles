onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "priority"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[keys]
split_vertical = ["prefix+v", "prefix+/"]
split_horizontal = ["prefix+minus", "prefix+e"]
edit_scrollback = "prefix+shift+e"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
# wt owns worktree creation.
new_worktree = ""

[update]
# mise pins the version; herdr update would bypass it.
version_check = false

[experimental]
pane_history = true
