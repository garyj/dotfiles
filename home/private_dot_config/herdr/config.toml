onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "priority"
tab_bar_right = [
  { type = "command", command = 'd=${HERDR_SOCKET_PATH%/*}; case $d in */sessions/*) echo "${d##*/}" ;; *) echo default ;; esac', interval_seconds = 31536000, timeout_seconds = 2 },
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[keys]
split_vertical = ["prefix+v", "prefix+/"]
split_horizontal = ["prefix+minus", "prefix+e"]
edit_scrollback = "prefix+shift+e"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
# wt owns worktree creation.
new_worktree = ""

[update]
# mise pins the version; herdr update would bypass it.
version_check = false

[experimental]
pane_history = true
