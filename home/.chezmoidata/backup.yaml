# Backup configuration - the single source of truth for what restic backs up.
# Edit this file, then run `chezmoi apply`. You never need to touch the wrapper
# script (~/bin/restic-backup) or the systemd units.
#
# Local hourly repo on this machine's /extra disk, plus an offsite copy to
# Wasabi (the `remote` block) pushed at the end of each run.
backup:
  # Machines that back up, matched against the hostname exactly. A backup needs
  # a second physical disk to be worth anything, so only hosts that have one
  # belong here. Anywhere else restic is skipped entirely.
  #
  # Note this is an exact match, not the `contains "noodle"` substring test that
  # sets `personal` - noodleLenivi is personal but has a single disk.
  enabled_hosts:
    - noodle

  # Where the local restic repo lives on this machine. /extra is a separate
  # physical disk from the (encrypted) root, so it survives the main drive dying.
  local_repo: /extra/garyj/restic

  # Refuse to run unless this path is a real mountpoint. Prevents silently
  # backing up to the root disk if /extra fails to mount. Leave empty on a
  # single-disk machine whose repo legitimately lives on the root filesystem.
  require_mounted: /extra

  # Paths to back up. A leading ~/ is expanded to your home directory at
  # `chezmoi apply` time.
  sources:
    - ~/dev
    - ~/cowork
    - ~/tries
    - ~/Documents
    - ~/Desktop
    - ~/Pictures
    - ~/.config
    - ~/.local/share
    - ~/.local/bin
    - ~/.ssh
    - ~/.gnupg
    - ~/.claude
    - ~/.claude.json
    - ~/.codex
    - ~/.agents
    - ~/.gemini
    - ~/.pi
    - ~/.copilot
    - ~/.zshrc
    - ~/.bashrc
    - ~/.profile
    - ~/.zsh_history
    - ~/Videos
    - ~/Music

  # Exclude rules. `**/foo` matches a folder named foo anywhere; `~/foo` is one
  # specific path. These are all regenerable caches / build artefacts.
  excludes:
    # dependency & build artefacts (regenerable, usually also in git)
    - "**/node_modules"
    - "**/.venv"
    - "**/venv"
    - "**/__pycache__"
    - "**/.pytest_cache"
    - "**/.mypy_cache"
    - "**/.ruff_cache"
    - "**/.tox"
    - "**/*.pyc"
    - "**/target"
    - "**/dist"
    - "**/build"
    - "**/.next"
    - "**/.nuxt"
    - "**/.svelte-kit"
    - "**/.turbo"
    - "**/.parcel-cache"
    - "**/coverage"
    # app & browser caches (keep the profile, drop the cache)
    - "**/Cache"
    - "**/Cache_Data"
    - "**/Code Cache"
    - "**/GPUCache"
    - "**/ShaderCache"
    - "**/Service Worker/CacheStorage"
    # user-level caches & big regenerable stores
    - ~/.cache
    - ~/.npm
    - ~/.cargo/registry
    - ~/.cargo/git
    - ~/.rustup/toolchains
    - ~/go/pkg
    - ~/.gradle/caches
    - ~/.m2/repository
    - ~/.docker
    - ~/.local/share/Trash
    - ~/.local/share/Steam
    - ~/.local/share/flatpak
    - ~/.local/share/containers
    - ~/.local/share/mise/installs
    - ~/snap
    - ~/.var/app
    # coding-agent caches & ephemera
    - ~/.claude/cache
    - ~/.claude/debug
    - ~/.claude/paste-cache
    - ~/.claude/session-env
    - ~/.claude/shell-snapshots
    - ~/.claude/statsig
    - ~/.claude/file-history
    - ~/.claude/plugins/cache
    - ~/.claude/plugins/marketplaces
    - ~/.codex/cache
    - ~/.codex/tmp
    # junk
    - "**/*.tmp"
    - "**/*.swp"
    - "**/.DS_Store"

  # How many snapshots `restic forget` keeps after each backup. Applied to both
  # the local repo and (mirrored) the offsite remote.
  retention:
    keep_hourly: 24
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 6
    keep_yearly: 0

  # Offsite copy. After each local backup the wrapper runs `restic copy` to this
  # remote in the same run (same lock), so the offsite is at most ~1h behind
  # local. Each machine is its own repo under <bucket>/<hostname>, so one bucket
  # holds every host. Backend credentials come from 1Password, rendered to
  # ~/.config/restic/remote-env. Leave `bucket` empty to disable the remote leg
  # (the copy is skipped and the local backup still runs).
  remote:
    # Wasabi S3 endpoint for the bucket's region (Sydney = ap-southeast-2).
    endpoint: s3.ap-southeast-2.wasabisys.com
    bucket: xbackups
    # Throttle the upload in KiB/s so a copy never saturates the uplink; mostly
    # matters for the one-time initial seed. Empty or 0 means unlimited.
    limit_upload: 0

  # Health monitoring. At the end of each run the backup pings healthchecks.io:
  # success, or .../fail with the reason if an invariant below is broken. No ping
  # at all trips the dead-man's-switch (a dead timer or an off machine). The URL
  # is a secret, kept in 1Password (this file is public) and rendered to
  # ~/.config/restic/healthchecks-url.
  monitoring:
    max_snapshots: 60           # more than this = retention not thinning
    max_lock_age_minutes: 60    # a lock older than this = a run died holding it
