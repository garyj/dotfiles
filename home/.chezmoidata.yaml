name: Gary Jarrel
email: gary@jarrel.com.au
agentName: Gary Jarrel [LC]
agentEmail: lara@jarrel.io  # must stay a verified email on the GitHub account
githubUser: garyj
langs:
  python: "3.14"
  mongodb: "8.2"

# Pinned CLI tools, installed via mise. The `# renovate:` annotations let
# Renovate open version-bump PRs; see renovate.json.
# Versions are stored bare (no leading v); Renovate normalizes on write-back.
tools:
  mise: "2026.8.12"     # renovate: datasource=github-releases depName=jdx/mise
  ast_grep: "0.45.2"   # renovate: datasource=github-releases depName=ast-grep/ast-grep
  worktrunk: "0.74.0"  # renovate: datasource=github-releases depName=max-sixty/worktrunk
  dust: "1.2.5"        # renovate: datasource=github-releases depName=bootandy/dust
  apm: "0.28.0"        # renovate: datasource=github-releases depName=microsoft/apm
  prek: "0.4.14"        # renovate: datasource=github-releases depName=j178/prek
  rtk: "0.45.0"        # renovate: datasource=github-releases depName=rtk-ai/rtk
  # These two are pinned so the binary (mise) and its agent skill
  # (.chezmoiexternal.toml.tmpl) install from the same release, like worktrunk.
  agent_browser: "0.35.0"  # renovate: datasource=github-releases depName=vercel-labs/agent-browser
  sentry: "0.43.0"         # renovate: datasource=github-releases depName=getsentry/cli
  # These two install via mise's pipx backend (PyPI), not GitHub releases.
  agentsview: "0.41.1"     # renovate: datasource=pypi depName=agentsview
  llm: "0.33"            # renovate: datasource=pypi depName=llm

# AI coding agents, all installed via mise.
coding_agents:
  claude: "2.1.246"     # renovate: datasource=github-releases depName=anthropics/claude-code
  codex: "0.150.0"      # renovate: datasource=github-releases depName=openai/codex
  copilot: "1.0.80"     # renovate: datasource=github-releases depName=github/copilot-cli
  opencode: "1.18.23"   # renovate: datasource=github-releases depName=anomalyco/opencode
  gemini: "0.57.0"      # renovate: datasource=npm depName=@google/gemini-cli
  pi: "0.84.3"          # renovate: datasource=npm depName=@earendil-works/pi-coding-agent
  # grok installs from the raw x.ai binary (mise registry http backend), but xAI
  # publishes @xai-official/grok to npm in version lockstep, so Renovate tracks that.
  grok: "1.0.5"         # renovate: datasource=npm depName=@xai-official/grok

# Pinned git refs for chezmoi externals (zsh-users cut no releases, so github-tags).
externals:
  zsh_syntax_highlighting: "0.8.0"  # renovate: datasource=github-tags depName=zsh-users/zsh-syntax-highlighting
  zsh_autosuggestions: "0.7.1"      # renovate: datasource=github-tags depName=zsh-users/zsh-autosuggestions

# GUI apps shipped as .deb on GitHub releases (no apt repo).
deb_apps:
  handy:  # offline speech-to-text
    version: "0.9.6"  # renovate: datasource=github-releases depName=cjpais/Handy

# Installed via their upstream cargo-dist installers. Bumping one changes the
# install script's hash, so `chezmoi apply` reinstalls the new version.
# uv is here rather than in mise for bootstrap ordering; see
# run_onchange_before_install-uv-python.sh.tmpl.
installers:
  atuin:
    version: "18.19.0"  # renovate: datasource=github-releases depName=atuinsh/atuin
  uv:
    version: "0.12.6"  # renovate: datasource=github-releases depName=astral-sh/uv

# Single static binaries pinned from GitHub releases, installed to /usr/local/bin.
# Off mise so the systemd backup timer finds them on the default PATH.
github_bins:
  restic:  # backup engine
    version: "0.19.1"  # renovate: datasource=github-releases depName=restic/restic
