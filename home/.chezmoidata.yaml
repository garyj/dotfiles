name: Gary Jarrel
email: gary@jarrel.com.au
agentName: Gary Jarrel [LC]
agentEmail: lara@jarrel.io  # must stay a verified email on the GitHub account
githubUser: garyj
langs:
  python: "3.14"
  mongodb: "8.2"

# Pinned Tier-3 CLI tools (installed via mise; audited before pinning). The
# `# renovate:` annotations let Renovate open version-bump PRs; see renovate.json.
# Versions are stored bare (no leading v); Renovate normalizes on write-back.
tools:
  mise: "2026.8.2"     # renovate: datasource=github-releases depName=jdx/mise
  ast_grep: "0.45.1"   # renovate: datasource=github-releases depName=ast-grep/ast-grep
  worktrunk: "0.72.0"  # renovate: datasource=github-releases depName=max-sixty/worktrunk
  dust: "1.2.4"        # renovate: datasource=github-releases depName=bootandy/dust
  apm: "0.28.0"        # renovate: datasource=github-releases depName=microsoft/apm
  prek: "0.4.12"        # renovate: datasource=github-releases depName=j178/prek
  rtk: "0.45.0"        # renovate: datasource=github-releases depName=rtk-ai/rtk
  # These two are pinned so the binary (mise) and its agent skill
  # (.chezmoiexternal.toml.tmpl) install from the same release, like worktrunk.
  agent_browser: "0.33.2"  # renovate: datasource=github-releases depName=vercel-labs/agent-browser
  sentry: "0.42.2"         # renovate: datasource=github-releases depName=getsentry/cli
  # These two install via mise's pipx backend (PyPI), not GitHub releases.
  agentsview: "0.40.1"     # renovate: datasource=pypi depName=agentsview
  llm: "0.32"            # renovate: datasource=pypi depName=llm

# AI coding agents, all installed via mise.
coding_agents:
  claude: "2.1.226"     # renovate: datasource=github-releases depName=anthropics/claude-code
  codex: "0.147.0"      # renovate: datasource=github-releases depName=openai/codex
  copilot: "1.0.78"     # renovate: datasource=github-releases depName=github/copilot-cli
  opencode: "1.18.16"   # renovate: datasource=github-releases depName=anomalyco/opencode
  gemini: "0.55.1"      # renovate: datasource=npm depName=@google/gemini-cli
  pi: "0.84.1"          # renovate: datasource=npm depName=@earendil-works/pi-coding-agent

# Pinned git refs for chezmoi externals (zsh-users cut no releases, so github-tags).
externals:
  zsh_syntax_highlighting: "0.8.0"  # renovate: datasource=github-tags depName=zsh-users/zsh-syntax-highlighting
  zsh_autosuggestions: "0.7.1"      # renovate: datasource=github-tags depName=zsh-users/zsh-autosuggestions

# GUI apps shipped as .deb on GitHub releases (no apt repo).
deb_apps:
  handy:  # offline speech-to-text
    version: "0.9.5"  # renovate: datasource=github-releases depName=cjpais/Handy

# Installed via their upstream cargo-dist installers. Bumping one changes the
# install script's hash, so `chezmoi apply` reinstalls the new version.
# uv is here rather than in mise because it runs from a run_onchange_before_
# script: it installs the Python interpreters, and mise's pipx backend needs uv
# to exist before mise itself runs. atuin tags are `vX.Y.Z`, uv tags are bare.
installers:
  atuin:
    version: "18.19.0"  # renovate: datasource=github-releases depName=atuinsh/atuin
  uv:
    version: "0.12.3"  # renovate: datasource=github-releases depName=astral-sh/uv

# Single static binaries pinned from GitHub releases, installed to /usr/local/bin.
# Off mise so the systemd backup timer finds them on the default PATH.
github_bins:
  restic:  # backup engine
    version: "0.19.1"  # renovate: datasource=github-releases depName=restic/restic
